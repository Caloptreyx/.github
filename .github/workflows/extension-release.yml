# Downloads the panel's prebuilt `panel-rs` release binary (falling back to building from source when the panel ref has
# no release asset), runs `panel-rs extensions export` against a staged panel checkout for the extension at a release
# tag, and uploads the archive to that release, replacing an asset of the same name. Called by every extension repo's
# release.yml. Each asset gets a `<asset>.sha256` companion (`sha256sum` output); the Extension Updater verifies
# archives against it and against GitHub's asset digest.
#
# Inputs:
#   tag            Release tag to export and upload to (required). The release must already exist.
#   panel-ref      Panel tag or branch to export with; `latest` (default) is the newest `release-*` tag. The archive
#                  comment names it: "generated by calagopus@<version>".
#   runner         Runner label for the job (default blacksmith-4vcpu-ubuntu-2404).
#   asset-name     Asset name (default `<id>.c7s.zip`, the export's own name: package_name with dots turned into
#                  underscores). Set it only where earlier releases used another name.
#   asset-aliases  Space-separated extra asset names to upload the same archive under (default none).
#
# The caller needs `permissions: contents: write`. The export only packs files; the extension itself is built and
# tested by extension-check.yml on every push.
name: Extension release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to export and upload to. The release must already exist.
        type: string
        required: true
      panel-ref:
        description: Panel tag or branch to export with. `latest` is the newest `release-*` tag.
        type: string
        default: latest
      runner:
        description: Runner label for the job.
        type: string
        default: blacksmith-4vcpu-ubuntu-2404
      asset-name:
        description: Asset name. Empty means the export's own `<id>.c7s.zip`.
        type: string
        default: ""
      asset-aliases:
        description: Space-separated extra asset names to upload the same archive under.
        type: string
        default: ""

permissions:
  contents: write

jobs:
  export:
    name: Export ${{ inputs.tag }} with panel ${{ inputs.panel-ref }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      # Fail in seconds rather than after the build when the release is missing.
      - name: Check the release exists
        run: gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName

      - name: Check out the extension at ${{ inputs.tag }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: extension

      - name: Stage the extension into the panel
        id: stage
        uses: Caloptreyx/.github/actions/stage-extension@main
        with:
          panel-ref: ${{ inputs.panel-ref }}

      # calagopus/panel publishes static Linux binaries on every GitHub release; download it to skip a full Rust build.
      - name: Download prebuilt panel-rs
        id: panel-rs
        env:
          PANEL_REF: ${{ steps.stage.outputs.ref }}
        run: |
          case "$(uname -m)" in
            x86_64) asset="panel-rs-x86_64-linux" ;;
            aarch64|arm64) asset="panel-rs-aarch64-linux" ;;
            *) asset="" ;;
          esac
          bin="${RUNNER_TEMP:-/tmp}/panel-rs"
          url="https://github.com/calagopus/panel/releases/download/${PANEL_REF}/${asset}"
          if [ -n "${asset}" ] && curl -fsSL --retry 3 --retry-delay 2 "${url}" -o "${bin}"; then
            chmod +x "${bin}"
            echo "Downloaded prebuilt ${asset} for ${PANEL_REF}"
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
            echo "bin=${bin}" >> "$GITHUB_OUTPUT"
          else
            rm -f "${bin}"
            echo "::notice::No prebuilt ${asset:-panel-rs} release asset for ${PANEL_REF}; falling back to cargo build"
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
            echo "bin=./target/debug/panel-rs" >> "$GITHUB_OUTPUT"
          fi

      # Fallback when panel-ref is a branch or a tag without a prebuilt release asset. The export builds no extension
      # code, so warnings in the panel's own crates must not block a release.
      - name: Set up Rust
        if: ${{ steps.panel-rs.outputs.prebuilt != 'true' }}
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ""
          build-warnings: warn
          cache-workspaces: panel -> target
          cache-key: panel-${{ steps.stage.outputs.ref }}

      # The binary embeds frontend/dist, which the export never reads, so a stand-in replaces the frontend build.
      - name: Build panel-rs
        if: ${{ steps.panel-rs.outputs.prebuilt != 'true' }}
        working-directory: panel
        run: |
          mkdir -p frontend/dist && echo stand-in > frontend/dist/index.html
          cargo build -p panel-rs

      # Without a terminal the export skips its interactive checks (cargo clippy, pnpm lint and build). panel-rs
      # panics at startup without APP_ENCRYPTION_KEY; with no DATABASE_URL it then runs CLI commands without an env.
      - name: Export the extension
        working-directory: panel
        env:
          APP_ENCRYPTION_KEY: export-only
          PANEL_RS: ${{ steps.panel-rs.outputs.bin }}
          PACKAGE: ${{ steps.stage.outputs.package }}
          EXT_ID: ${{ steps.stage.outputs.id }}
        run: |
          "${PANEL_RS}" extensions export "${PACKAGE}"
          "${PANEL_RS}" extensions inspect "exported-extensions/${EXT_ID}.c7s.zip"

      - name: Upload to the release
        working-directory: panel/exported-extensions
        env:
          EXT_ID: ${{ steps.stage.outputs.id }}
          ASSET_NAME: ${{ inputs.asset-name }}
          ALIASES: ${{ inputs.asset-aliases }}
        run: |
          name="${ASSET_NAME:-${EXT_ID}.c7s.zip}"
          [ "${name}" = "${EXT_ID}.c7s.zip" ] || mv "${EXT_ID}.c7s.zip" "${name}"
          assets=("${name}")
          for alias in ${ALIASES}; do
            cp "${name}" "${alias}"
            assets+=("${alias}")
          done
          files=()
          for asset in "${assets[@]}"; do
            sha256sum "${asset}" > "${asset}.sha256"
            files+=("${asset}" "${asset}.sha256")
          done
          gh release upload "${TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          cat ./*.sha256
