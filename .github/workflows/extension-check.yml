# Builds a Calagopus extension inside a real panel checkout: the frontend (typecheck, lint/format check, vite build)
# and the backend crate (cargo test). Called by every extension repo's check.yml.
name: Extension check

on:
  workflow_call:
    inputs:
      panel-ref:
        description: Panel tag or branch to build against. `latest` is the newest `release-*` tag.
        type: string
        default: latest
      runner:
        description: Runner label for the job.
        type: string
        default: blacksmith-4vcpu-ubuntu-2404
      lint:
        description: >-
          Run the panel's lint and format check. Turn it off when checking an older panel floor whose tooling
          (Biome before 1.2.10) disagrees with the formatter the extension now follows.
        type: boolean
        default: true
      build-warnings:
        description: >-
          Cargo's build.warnings: `deny` fails on any warning. An older panel floor built with today's stable Rust
          warns in its own crates (newly deprecated std APIs), so a floor check sets `warn`.
        type: string
        default: deny

permissions:
  contents: read

jobs:
  check:
    name: Build against panel ${{ inputs.panel-ref }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the extension
        uses: actions/checkout@v7
        with:
          path: extension

      # Panel checkout and staging (both extension layouts) are shared with extension-release.yml.
      - name: Stage the extension into the panel
        id: stage
        uses: Caloptreyx/.github/actions/stage-extension@main
        with:
          panel-ref: ${{ inputs.panel-ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: panel/frontend/pnpm-lock.yaml

      # The staged extension is a new workspace package, so the lockfile has to change.
      - name: Install frontend dependencies
        working-directory: panel/frontend
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        working-directory: panel/frontend
        run: pnpm typecheck

      - name: Lint and format check
        if: ${{ inputs.lint }}
        working-directory: panel/frontend
        env:
          EXT_ID: ${{ steps.stage.outputs.id }}
        run: |
          target="extensions/${EXT_ID}"
          if pnpm exec biome --version >/dev/null 2>&1; then
            pnpm exec biome check "$target"
          else
            pnpm exec oxlint "$target"
            pnpm exec oxfmt --check "$target"
          fi

      - name: Build the frontend
        working-directory: panel/frontend
        run: pnpm build

      - name: Run the extension's node tests
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && hashFiles('extension/tests/*.test.ts') != '' }}
        working-directory: extension
        run: node --test "tests/*.test.ts"

      - name: Set up Rust
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ""
          build-warnings: ${{ inputs.build-warnings }}
          cache-workspaces: panel -> target
          cache-key: panel-${{ steps.stage.outputs.ref }}

      # The backend embeds frontend/dist; a stand-in keeps the crate compiling when the frontend build failed.
      - name: Test the backend crate
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        working-directory: panel
        env:
          CRATE: ${{ steps.stage.outputs.crate }}
        run: |
          [ -f frontend/dist/index.html ] || { mkdir -p frontend/dist && echo stand-in > frontend/dist/index.html; }
          cargo test -p "${CRATE}"
